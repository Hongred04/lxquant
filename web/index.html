<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf9">
<title>大金融中长线</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <div class="boot" id="boot">正在算…</div>

  <section class="hero" id="hero" hidden>
    <div class="vs">
      <b id="vs-num">—</b><i>%</i>
    </div>
    <div class="vs-cap">大盘比 20 日线</div>
    <div class="verdict" id="verdict">
      <span class="dot"></span><span id="verdict-txt">—</span>
    </div>
    <div class="action" id="action"></div>
  </section>

  <section class="picks" id="picks" hidden></section>

  <section class="hist" id="hist" hidden>
    <canvas id="cv" height="150"></canvas>
    <div class="facts" id="facts"></div>
  </section>

  <footer id="foot"></footer>

</main>

<script src="app.js"></script>
</body>
</html>
